- name: Update webservers
  hosts: all
  become: true

  tasks:
    - name: Install apache on webservers
      ansible.builtin.package:
        name: apache2
        state: present

    - name: Ensure apache is running
      service:
        name: apache2
        state: started
        enabled: true

    - name: Install qemu guest agent
      ansible.builtin.package:
        name: qemu-guest-agent
        state: present
